  bs[2].textContent=tr("cdel");bs[2].onclick=()=>{if(confirm(tr("cask"))){MY=MY.filter(x=>x.id!=c.id);delete R[k];sv("rcu",MY);renderCust()}};
  o.appendChild(s);if(R[k])show(k,R[k],"")})}
function edit(id){EDID=id;const c=MY.find(x=>x.id==id)||{name:"",items:[]};$("en").value=c.name;$("eo").value=c.items.join("\n");$("ed").hidden=false;$("en").focus()}
$("cn").onclick=()=>edit(null);$("ec").onclick=()=>{$("ed").hidden=true};
$("es").onclick=()=>{const name=$("en").value.trim(),items=$("eo").value.split("\n").map(x=>x.trim()).filter(Boolean);
 if(!name||items.length<2){alert(tr("cerr"));return}
 if(EDID){const c=MY.find(x=>x.id==EDID);c.name=name;c.items=items}else MY.push({id:Date.now().toString(36),name,items});
 sv("rcu",MY);$("ed").hidden=true;renderCust()};

setTh(TH[ld("rt","white")]?ld("rt","white"):"white");applyLang();
</script></body></html>
