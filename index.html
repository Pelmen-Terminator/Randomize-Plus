[data-theme=black]{--bg:#09090b;--panel:#151518;--ink:#f3f3f5;--mute:#9b9ba5;--line:#2a2a30;--acc:#4fd1c5;--on:#06201e;--sun:#ffd24a;color-scheme:dark}
[data-theme=gray]{--bg:#3a3e45;--panel:#484d56;--ink:#f1f2f4;--mute:#b9bdc6;--line:#5f6571;--acc:#ffd166;--on:#2a2410;--sun:#8fd3ff;color-scheme:dark}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transition:background-color .5s,color .5s}
.w{max-width:960px;margin:0 auto;padding:20px 16px}
.bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:12px}
.lang{display:grid;grid-template-columns:repeat(3,auto);gap:6px}
.lang button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 13px Rubik,sans-serif;cursor:pointer;transition:all .25s}
.lang button[aria-pressed=true]{background:var(--acc);color:var(--on);border-color:var(--acc);transform:scale(1.05)}
.sw{display:flex;gap:10px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s;padding:0}
.sw button:hover{transform:scale(1.15)}
.sw button[aria-pressed=true]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--acc);transform:scale(1.1)}
.hero{display:flex;align-items:center;gap:16px;margin:10px 0 4px}
#die{font-size:clamp(56px,13vw,96px);line-height:1;display:inline-block;color:var(--acc);perspective:400px}

.sub{color:var(--mute);margin:6px 0 18px}

.all:active,.b:active{transform:scale(.97)}
.all::after,.b::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.all:hover::after,.b:hover::after{transform:translateX(120%)}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.c{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:background-color .5s,border-color .5s;animation:in .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.c.pulse::before{content:"";position:absolute;inset:-1px;border-radius:16px;pointer-events:none;animation:ring .9s ease-out}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--acc)}100%{box-shadow:0 0 0 16px transparent}}
.c h2{margin:0;font-size:15px;font-weight:600;color:var(--mute)}
.v{font-size:clamp(26px,5vw,38px);font-weight:800;line-height:1.15;min-height:1.2em;overflow-wrap:anywhere}
.v.r{color:var(--mute)}
.v.spin{opacity:.55;filter:blur(1.6px);transform:translateY(-3px);transition:none}
.v.land{animation:land .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes land{0%{opacity:.3;transform:scale(.6) translateY(16px);filter:blur(6px)}60%{transform:scale(1.08)}100%{opacity:1;transform:none;filter:none}}
.note{font-size:12px;color:var(--mute);margin:-4px 0 0}
.b{position:relative;overflow:hidden;padding:12px;font:600 16px Rubik,sans-serif;background:var(--acc);color:var(--on);border:0;border-radius:10px;cursor:pointer;transition:transform .15s}

select{padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.wide{grid-column:1/-1}
ol{margin:0;padding-left:22px;max-height:220px;overflow:auto;color:var(--mute)}
ol li{animation:in .4s both}
.dl{display:flex;flex-wrap:wrap;gap:10px}.dl a{color:var(--acc);font-weight:600}
.lnk{border:0;background:none;color:var(--acc);cursor:pointer;font:600 14px Rubik,sans-serif;float:right}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);text-align:center;font-size:14px}
